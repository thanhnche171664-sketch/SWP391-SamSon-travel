<!DOCTYPE html>
<html lang="en">
    <head>
        <title>SamSon Travel Booking Service</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: Arial, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                text-align: center;
                max-width: 400px;
                width: 90%;
            }
            h1 {
                color: #333;
                margin-bottom: 1rem;
            }
            .btn {
                display: inline-block;
                padding: 12px 24px;
                margin: 10px;
                background: #667eea;
                color: white;
                text-decoration: none;
                border-radius: 5px;
                transition: background 0.3s;
            }
            .btn:hover {
                background: #5a6fd8;
            }
            .btn-secondary {
                background: #6c757d;
            }
            .btn-secondary:hover {
                background: #5a6268;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>SamSon Travel Booking Service</h1>
            <p>Welcome to our travel booking platform. Please choose an option below:</p>
            <div>
                <a href="login.jsp" class="btn">Login</a>
                <a href="register.jsp" class="btn btn-secondary">Register</a>
            </div>
        </div>
    </body>
</html>
