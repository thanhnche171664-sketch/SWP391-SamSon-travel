<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Compass icon -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  <circle cx="30" cy="30" r="3" fill="url(#logoGradient)"/>
  
  <!-- Compass directions -->
  <line x1="30" y1="10" x2="30" y2="15" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="30" y1="45" x2="30" y2="50" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="10" y1="30" x2="15" y2="30" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="45" y1="30" x2="50" y2="30" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Wave pattern -->
  <path d="M60 25 Q70 15 80 25 T100 25" stroke="url(#logoGradient)" stroke-width="2" fill="none"/>
  <path d="M60 35 Q70 25 80 35 T100 35" stroke="url(#logoGradient)" stroke-width="2" fill="none"/>
  
  <!-- Text -->
  <text x="110" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)">SamSon</text>
  <text x="110" y="45" font-family="Arial, sans-serif" font-size="14" fill="#666">Travel</text>
</svg>
